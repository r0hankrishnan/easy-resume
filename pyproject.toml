[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-resume"
version = "0.2.0"
description = "Generate polished resume PDFs from YAML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "playwright",
    "jinja2",
    "pydantic[email]",
]

[project.scripts]
easy-resume = "easy_resume.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
easy_resume = [
    "styles/*.css",
    "template/*.html"
]